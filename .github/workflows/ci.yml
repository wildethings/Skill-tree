name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The icon sprite and its search catalog are generated, not committed, so
      # every script that reads them builds them first (see package.json).
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - run: npm run typecheck

      - name: Unit tests
        run: npm test

      - run: npm run build

  rls:
    name: RLS policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Applies the real migration to a stock Postgres and asserts the policies
    # themselves. No credentials, so it can run on every pull request.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - name: Apply the migration and test the policies
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/test/00-stubs.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_init.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/test/rls.test.sql

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The checks drive the real app and need the dev-only store handle, so
      # they run against `npm run dev` rather than a preview of the build.
      - name: Start the dev server
        run: npm run dev > /tmp/vite.log 2>&1 &

      # browser-test.mjs waits for the server itself, so there is no sleep here.
      - name: Browser checks
        run: npm run test:browser

      - name: Dev server log
        if: failure()
        run: cat /tmp/vite.log

# Frame timing (npm run test:perf) is deliberately not gated here: a shared
# runner with no GPU cannot hold a meaningful threshold. Run it locally.
